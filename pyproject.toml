[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "imapbackup3"
dynamic = ["version"]
description = "A Python package for creating full backups of IMAP mailboxes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David M. Straub", email = "straub@pm.me" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email :: Post-Office :: IMAP",
]

[project.urls]
Homepage = "https://github.com/DavidMStraub/imapbackup3"
Issues = "https://github.com/DavidMStraub/imapbackup3/issues"

[project.scripts]
imapbackup3 = "imapbackup3.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["imapbackup3*"]

[tool.setuptools.package-data]
imapbackup3 = ["py.typed"]

[tool.setuptools_scm]
version_file = "imapbackup3/_version.py"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["imapbackup3"]
warn_unused_ignores = true
warn_redundant_casts = true
